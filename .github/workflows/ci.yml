name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  domain-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: acougue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
        env:
          DATABASE_TEST_URL: postgres://postgres:ephemeral-test-only@localhost:5432/acougue_test
      - run: |
          pnpm start > /tmp/acougue-web.log 2>&1 &
          pnpm test:http
        env:
          DATABASE_URL: postgres://postgres:ephemeral-test-only@localhost:5432/acougue_test
          APP_URL: http://localhost:3000
          APP_TEST_URL: http://localhost:3000
          ALLOW_SIGNUP: 'true'
